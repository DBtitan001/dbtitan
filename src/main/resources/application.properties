spring.application.name=dbtitan

# --- PostgreSQL Connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/myapp_db
spring.datasource.username=app_user
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Config ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- SQL Script Initialization Config ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Disable Spring AI Auto-Configurations temporarily for local testing ---
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration