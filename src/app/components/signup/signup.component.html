<div class="login-wrapper">
  <div class="brand-section">
    <div class="brand-content">
      <div class="logo-shield">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 2Z" fill="#0056D2" stroke="#0066FF" stroke-width="1.5"/>
          <path d="M9 12L11 14L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="brand-title">KYC CLM Platform</h1>
      <p class="brand-subtitle">Client Lifecycle Management</p>
      <p class="brand-highlight">Onboarding to Offboarding</p>
    </div>
    <div class="copyright">
      &copy; 2026 KYC CLM Platform. All rights reserved.
    </div>
  </div>

  <div class="form-section">
    <div class="card">
      <h2 class="title">Create Account</h2>
      <p class="subtitle">Sign up to get started with KYC CLM Platform</p>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Choose a username"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Create a password"
          />
        </div>

        <div *ngIf="errorMessage" class="error-alert">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="!signupForm.valid || isLoading">
          {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>
