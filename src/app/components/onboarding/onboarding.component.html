<div class="layout-wrapper">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="shield-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 00-5.25 5.25v3a3 3 0 00-3 3v6.75a3 3 0 003 3h10.5a3 3 0 003-3v-6.75a3 3 0 00-3-3v-3c0-2.9-2.35-5.25-5.25-5.25zm3.75 8.25v-3a3.75 3.75 0 10-7.5 0v3h7.5z" clip-rule="evenodd" />
        </svg>
      </div>
      <span>KYC CLM</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item"><i class="icon">📊</i> Dashboard</a>
      <a routerLink="/clients" routerLinkActive="active" class="nav-item"><i class="icon">👥</i> Clients</a>
      <a routerLink="/onboarding" routerLinkActive="active" class="nav-item"><i class="icon">🔄</i> Onboarding</a>
      <a routerLink="/kyc-review" routerLinkActive="active" class="nav-item"><i class="icon">🛡️</i> KYC Review</a>
      <a routerLink="/alerts" routerLinkActive="active" class="nav-item"><i class="icon">🔔</i> Alerts</a>
      <a class="nav-item"><i class="icon">📋</i> Tasks</a>
      <a class="nav-item"><i class="icon">📁</i> Documents</a>
      <a class="nav-item"><i class="icon">📈</i> Reports</a>
      <a class="nav-item"><i class="icon">📄</i> Audit Trail</a>
      <a class="nav-item"><i class="icon">🚪</i> Offboarding</a>
      <a class="nav-item"><i class="icon">⚙️</i> Settings</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="page-container">
      <h2>Onboarding</h2>
      <p class="breadcrumbs">
        <a routerLink="/dashboard" class="home-link">Home</a> / Onboarding / New Client
      </p>

      <div class="stepper">
        <div class="step" [class.active]="currentStep >= 1">
          <div class="circle">1</div>
          <span>Basic Information</span>
        </div>
        <div class="step" [class.active]="currentStep >= 2">
          <div class="circle">2</div>
          <span>Contact Details</span>
        </div>
        <div class="step" [class.active]="currentStep >= 3">
          <div class="circle">3</div>
          <span>Business Details</span>
        </div>
        <div class="step" [class.active]="currentStep >= 4">
          <div class="circle">4</div>
          <span>Documents</span>
        </div>
        <div class="step" [class.active]="currentStep >= 5">
          <div class="circle">5</div>
          <span>Review & Submit</span>
        </div>
      </div>

      <div class="form-card" [formGroup]="onboardingForm">
        <h3>Basic Information</h3>

        <div class="form-grid">
          <div class="form-group">
            <label>Client Type</label>
            <select formControlName="clientType">
              <option value="Corporate">Corporate</option>
              <option value="Individual">Individual</option>
            </select>
          </div>

          <div class="form-group">
            <label>Client Name</label>
            <input type="text" formControlName="clientName" placeholder="Enter Client Name" />
          </div>

          <div class="form-group">
            <label>Date of Incorporation</label>
            <input type="date" formControlName="dateOfIncorporation" />
          </div>

          <div class="form-group">
            <label>Country of Incorporation</label>
            <input type="text" formControlName="countryOfIncorporation" placeholder="Select Country" />
          </div>

          <div class="form-group">
            <label>Registration Number</label>
            <input type="text" formControlName="registrationNumber" placeholder="Enter Registration Number" />
          </div>

          <div class="form-group">
            <label>PAN / Tax ID</label>
            <input type="text" formControlName="panTaxId" placeholder="Enter PAN / Tax ID" />
          </div>
        </div>

        <div class="button-row">
          <button class="btn-secondary" routerLink="/dashboard">Cancel</button>
          <button class="btn-primary" (click)="nextStep()">Next</button>
        </div>
      </div>
    </div>
  </main>
</div>
